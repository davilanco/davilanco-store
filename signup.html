  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">
  
<link rel="stylesheet" href="/css/pages/signup.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/"><img src="/images/logo.jpg" alt="Davilanco"></a>
    <div>
      <button class="icon-btn" type="button" onclick="toggleTheme()">🌓</button>
      <button class="nav-menu-toggle" type="button" onclick="toggleNav()" aria-label="Open menu" aria-controls="navDrawer" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
    <nav id="navDrawer">
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/signup.html">Create Account</a>

    </nav>
  </header>

  <main>
    <h1>Create Account</h1>
    <p class="subtitle">New accounts start as Customer. We will email a verification code.</p>

    <form id="signupForm">
      <input type="text" id="firstname" placeholder="First Name *" required>
      <input type="text" id="lastname" placeholder="Last Name *" required>
      <input type="text" id="nickname" placeholder="Nickname *" required>
      <input type="tel" id="phone" placeholder="Phone Number *" required>
      <input type="email" id="email" placeholder="Email Address *" required>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password (8+, upper, number, symbol) *" required>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</button>
      </div>
      <div class="password-wrapper">
        <input type="password" id="password2" placeholder="Confirm Password *" required>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password2')">👁️</button>
      </div>
      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <p id="msg"></p>
    <p class="login-link">Already have an account? <a href="/login.html">Login</a></p>
  </main>

  <footer>Davilanco © 2026</footer>

  
  <script src="/analytics.js" defer></script>
<script src="/script.js"></script>
  <script src="/js/pages/signup.js"></script>
</body>
</html>
