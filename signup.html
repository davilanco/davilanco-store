<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">
  <style>
    :root {
      --gold: #FFD700; --bg: #000; --text: #fff;
      --grey: #1a1a1a; --card: #111; --border: #333;
    }
    [data-theme="light"] {
      --bg: #fff; --text: #001F3F; --grey: #f4f4f4; --card: #fff; --border: #e0e0e0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; border-bottom: 2px solid var(--gold);
      position: sticky; top: 0; background: var(--bg); z-index: 50;
    }
    header img { height: 32px; }
    .icon-btn {
      background: none; border: none; font-size: 20px;
      cursor: pointer; color: var(--text); padding: 6px;
    }
    #navDrawer {
      position: fixed; top: 0; right: -100%;
      width: 25%; min-width: 260px; max-width: 320px;
      height: 100vh; background: var(--bg);
      border-left: 2px solid var(--gold);
      padding: 24px 20px; transition: right 0.3s; z-index: 100;
    }
    #navDrawer.open { right: 0; }
    #navDrawer a {
      display: block; padding: 12px 0; color: var(--text);
      text-decoration: none; border-bottom: 1px solid var(--border);
    }
    main {
      flex: 1; padding: 24px 16px; max-width: 440px; margin: 0 auto; width: 100%;
    }
    h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .subtitle { font-size: 0.9rem; opacity: 0.75; margin-bottom: 20px; }
    input {
      width: 100%; padding: 10px; margin-bottom: 14px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 4px; font-size: 14px;
    }
    .password-wrapper {
      position: relative; margin-bottom: 14px;
    }
    .password-wrapper input {
      width: 100%; margin-bottom: 0; padding-right: 40px;
    }
    .toggle-password {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text); cursor: pointer;
      font-size: 18px; padding: 4px;
    }
    button[type="submit"] {
      width: 100%; padding: 10px; background: var(--gold);
      color: var(--bg); border: none; border-radius: 4px;
      font-weight: 600; cursor: pointer; font-size: 14px;
    }
    button[type="submit"]:hover { opacity: 0.9; }
    button[type="submit"]:disabled { opacity: 0.6; }
    #msg { margin-top: 14px; text-align: center; font-size: 14px; }
    .error { color: #e74c3c; }
    .success { color: #27ae60; }
    .login-link { text-align: center; margin-top: 18px; font-size: 14px; }
    .login-link a { color: var(--gold); font-weight: 600; }
    footer {
      text-align: center; padding: 18px; font-size: 13px;
      border-top: 1px solid var(--border); margin-top: auto;
    }
  </style>
</head>
<body>
  <header>
    <a href="/"><img src="/images/logo.jpg" alt="Davilanco"></a>
    <div>
      <button class="icon-btn" type="button" onclick="toggleTheme()">🌓</button>
      <button class="icon-btn" type="button" onclick="toggleNav()">☰</button>
    </div>
    <nav id="navDrawer">
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/signup.html">Create Account</a>
      <a href="#" onclick="toggleNav();return false;">Close ✕</a>
    </nav>
  </header>

  <main>
    <h1>Create Account</h1>
    <p class="subtitle">New accounts start as Customer. We will email a verification code.</p>

    <form id="signupForm">
      <input type="text" id="firstname" placeholder="First Name *" required>
      <input type="text" id="lastname" placeholder="Last Name *" required>
      <input type="text" id="nickname" placeholder="Nickname *" required>
      <input type="tel" id="phone" placeholder="Phone Number *" required>
      <input type="email" id="email" placeholder="Email Address *" required>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password (8+, upper, number, symbol) *" required>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</button>
      </div>
      <div class="password-wrapper">
        <input type="password" id="password2" placeholder="Confirm Password *" required>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password2')">👁️</button>
      </div>
      <button type="submit" id="submitBtn">Create Account</button>
    </form>
    <p id="msg"></p>
    <p class="login-link">Already have an account? <a href="/login.html">Login</a></p>
  </main>

  <footer>Davilanco © 2026</footer>

  <script>
    var savedTheme = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', savedTheme || 'dark');

    function toggleTheme() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function toggleNav() {
      document.getElementById('navDrawer').classList.toggle('open');
    }

    function togglePasswordVisibility(fieldId) {
      var field = document.getElementById(fieldId);
      var newType = field.type === 'password' ? 'text' : 'password';
      field.type = newType;
    }

    document.getElementById('signupForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var msg = document.getElementById('msg');
      var btn = document.getElementById('submitBtn');
      var password = document.getElementById('password').value;
      var password2 = document.getElementById('password2').value;

      if (password.length < 8 || !/[A-Z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        msg.className = 'error';
        msg.textContent = 'Password must be 8+ chars with uppercase, number and symbol';
        return;
      }
      if (password !== password2) {
        msg.className = 'error';
        msg.textContent = 'Passwords do not match';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating...';
      msg.textContent = '';

      try {
        var res = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            firstname: document.getElementById('firstname').value.trim(),
            lastname: document.getElementById('lastname').value.trim(),
            nickname: document.getElementById('nickname').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: password
          })
        });
        var data = await res.json();

        if (data.ok) {
          msg.className = 'success';
          msg.innerHTML = 'Account created! Check your email for verification code. <br><a href="/verify.html" style="color:var(--gold)">Verify now</a>';
          document.getElementById('signupForm').reset();
        } else {
          msg.className = 'error';
          msg.textContent = data.error || 'Signup failed';
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      } catch (e) {
        msg.className = 'error';
        msg.textContent = 'Network error: ' + e.message;
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
