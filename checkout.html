<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">

  <style>
    :root {
      --gold: #FFD700;
      --lemon: #C4FF61;
      --navy: #001F3F;
      --bg: #000000;
      --text: #ffffff;
      --grey: #1a1a1a;
      --card: #111111;
      --border: #333333;
    }

    [data-theme="light"] {
      --bg: #ffffff;
      --text: #001F3F;
      --grey: #f4f4f4;
      --card: #ffffff;
      --border: #e0e0e0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 2px solid var(--gold);
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 50;
    }

    header img { height: 32px; }

    .icon-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text);
      padding: 6px;
    }

    #navDrawer {
      position: fixed;
      top: 0;
      right: -100%;
      width: 25%;
      min-width: 260px;
      max-width: 320px;
      height: 100vh;
      background: var(--bg);
      border-left: 2px solid var(--gold);
      padding: 24px 20px;
      transition: right 0.3s ease;
      z-index: 100;
      overflow-y: auto;
      box-shadow: -4px 0 20px rgba(0,0,0,0.4);
    }

    #navDrawer.open { right: 0; }

    #navDrawer a {
      display: block;
      padding: 12px 0;
      color: var(--text);
      text-decoration: none;
      font-weight: 500;
      border-bottom: 1px solid var(--border);
    }

    #navDrawer a:hover { color: var(--gold); }

    main {
      flex: 1;
      padding: 20px 16px;
      max-width: 700px;
      margin: 0 auto;
      width: 100%;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0.75;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .card h3 {
      font-size: 1.05rem;
      margin-bottom: 14px;
      color: var(--gold);
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      opacity: 0.85;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--grey);
      color: var(--text);
      font-size: 15px;
      margin-bottom: 12px;
    }

    textarea { min-height: 80px; resize: vertical; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 500px) {
      .row { grid-template-columns: 1fr; }
    }

    .payment-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .payment-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
    }

    .payment-option input {
      width: auto;
      margin: 0;
    }

    .payment-option.selected {
      border-color: var(--gold);
      background: rgba(255, 215, 0, 0.08);
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 15px;
    }

    .summary-row.total {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold);
      border-top: 1px solid var(--border);
      padding-top: 12px;
      margin-top: 12px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 15px;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
    }

    .empty a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 24px;
      background: var(--gold);
      color: #000;
      text-decoration: none;
      border-radius: 10px;
      font-weight: 600;
    }

    footer {
      text-align: center;
      padding: 18px;
      font-size: 13px;
      border-top: 1px solid var(--border);
      margin-top: auto;
    }

    #backToTop {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: var(--gold);
      border: none;
      font-size: 20px;
      cursor: pointer;
      display: none;
      z-index: 40;
    }

    #msg {
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
    }
    .error { color: #e74c3c; }
    .success { color: #27ae60; }
  </style>
</head>
<body>

  <header>
    <a href="/"><img src="/images/logo.jpg" alt="Davilanco"></a>
    <div>
      <button class="icon-btn" onclick="toggleTheme()">🌓</button>
      <button class="icon-btn" onclick="toggleNav()">☰</button>
    </div>
  </header>

  <nav id="navDrawer">
    <a href="/">Home</a>
    <a href="/cart.html">Cart</a>
    <a href="/dashboard.html">Dashboard</a>
    <br>
    <a href="#" onclick="toggleNav()">Close ✕</a>
  </nav>

  <main>
    <h1>Checkout</h1>
    <p class="subtitle">Complete your order</p>

    <div id="checkoutContent"></div>
  </main>

  <footer>
    Davilanco © 2026
  </footer>

  <button id="backToTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

  <script>
    // Theme
    const savedTheme = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', savedTheme || 'dark');

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    function toggleNav() {
      document.getElementById('navDrawer').classList.toggle('open');
    }

    window.addEventListener('scroll', function() {
      document.getElementById('backToTop').style.display = window.scrollY > 300 ? 'block' : 'none';
    });

    // Nigerian States
    const states = [
      "Abia","Adamawa","Akwa Ibom","Anambra","Bauchi","Bayelsa","Benue","Borno",
      "Cross River","Delta","Ebonyi","Edo","Ekiti","Enugu","FCT","Gombe","Imo",
      "Jigawa","Kaduna","Kano","Katsina","Kebbi","Kogi","Kwara","Lagos","Nasarawa",
      "Niger","Ogun","Ondo","Osun","Oyo","Plateau","Rivers","Sokoto","Taraba","Yobe","Zamfara"
    ];

    function getCart() {
      try {
        return JSON.parse(localStorage.getItem('cart') || '[]');
      } catch (e) {
        return [];
      }
    }

    function renderCheckout() {
      const cart = getCart();
      const container = document.getElementById('checkoutContent');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty">
            <h2>Your cart is empty</h2>
            <p>Add some products before checking out.</p>
            <a href="/">Continue Shopping</a>
          </div>
        `;
        return;
      }

      let total = 0;
      cart.forEach(function(item) {
        total += item.price * item.quantity;
      });

      let stateOptions = states.map(function(s) {
        return '<option value="' + s + '">' + s + '</option>';
      }).join('');

      container.innerHTML = `
        <form id="checkoutForm">
          <!-- Delivery Details -->
          <div class="card">
            <h3>Delivery Details</h3>

            <div class="row">
              <div>
                <label>First Name *</label>
                <input type="text" id="firstname" required>
              </div>
              <div>
                <label>Last Name *</label>
                <input type="text" id="lastname" required>
              </div>
            </div>

            <label>Phone Number *</label>
            <input type="tel" id="phone" required>

            <label>Alternative Phone</label>
            <input type="tel" id="alt_phone">

            <label>Neighbor’s Phone</label>
            <input type="tel" id="neighbor_phone">

            <label>Full Address *</label>
            <textarea id="address" required placeholder="Street, house number, landmark"></textarea>

            <label>Town *</label>
            <input type="text" id="town" required>

            <label>Local Government Area *</label>
            <input type="text" id="lga" required placeholder="e.g. Ikeja, Eti-Osa, Chikun">

            <label>State *</label>
            <select id="state" required>
              <option value="">Select State</option>
              ${stateOptions}
            </select>
          </div>

          <!-- Payment Method -->
          <div class="card">
            <h3>Payment Method</h3>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment" value="bank_transfer" checked>
                <span>Bank Transfer</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="paystack">
                <span>Paystack</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="flutterwave">
                <span>Flutterwave</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" value="paypal">
                <span>PayPal</span>
              </label>
            </div>
          </div>

          <!-- Order Summary -->
          <div class="card">
            <h3>Order Summary</h3>
            <div id="orderItems"></div>
            <div class="summary-row total">
              <span>Total</span>
              <span>₦${total.toLocaleString()}</span>
            </div>
          </div>

          <button type="submit" id="submitBtn">Place Order</button>
          <p id="msg"></p>
        </form>
      `;

      // Show items in summary
      let itemsHtml = '';
      cart.forEach(function(item) {
        itemsHtml += `
          <div class="summary-row">
            <span>${item.name} × ${item.quantity}</span>
            <span>₦${(item.price * item.quantity).toLocaleString()}</span>
          </div>
        `;
      });
      document.getElementById('orderItems').innerHTML = itemsHtml;

      // Highlight selected payment
      document.querySelectorAll('.payment-option').forEach(function(opt) {
        opt.addEventListener('click', function() {
          document.querySelectorAll('.payment-option').forEach(function(o) {
            o.classList.remove('selected');
          });
          opt.classList.add('selected');
          opt.querySelector('input').checked = true;
        });
      });
      document.querySelector('.payment-option').classList.add('selected');

      // Form submit
      document.getElementById('checkoutForm').addEventListener('submit', handleCheckout);
    }

    function handleCheckout(e) {
      e.preventDefault();

      const msg = document.getElementById('msg');
      const btn = document.getElementById('submitBtn');
      const cart = getCart();

      const firstname = document.getElementById('firstname').value.trim();
      const lastname = document.getElementById('lastname').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const town = document.getElementById('town').value.trim();
      const lga = document.getElementById('lga').value.trim();
      const state = document.getElementById('state').value;
      const payment = document.querySelector('input[name="payment"]:checked').value;

      if (!firstname || !lastname || !phone || !address || !town || !lga || !state) {
        msg.className = 'error';
        msg.textContent = 'Please fill all required fields';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Processing...';
      msg.textContent = '';

      // Calculate total
      let total = 0;
      cart.forEach(function(item) {
        total += item.price * item.quantity;
      });

      // For now we simulate success (API will be connected later)
      const orderData = {
        firstname: firstname,
        lastname: lastname,
        phone: phone,
        alt_phone: document.getElementById('alt_phone').value.trim(),
        neighbor_phone: document.getElementById('neighbor_phone').value.trim(),
        address: address,
        town: town,
        lga: lga,
        state: state,
        payment_method: payment,
        items: cart,
        total: total
      };

      // Save order reference locally for now
      const orderRef = 'DAV-' + Date.now();
      localStorage.setItem('lastOrder', JSON.stringify({
        reference: orderRef,
        ...orderData,
        status: 'Pending',
        created_at: new Date().toISOString()
      }));

      // Clear cart
      localStorage.removeItem('cart');

      msg.className = 'success';
      msg.textContent = 'Order placed successfully! Reference: ' + orderRef;

      setTimeout(function() {
        window.location.href = '/dashboard.html';
      }, 2000);
    }

    // Start
    renderCheckout();
  </script>
</body>
  </html>
