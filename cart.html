<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Davilanco</title>
<style>
:root{--gold:#FFD700;--navy:#001F3F;--lemon:#C4FF61;--bg:#fff;--text:#001F3F;--grey:#f5f5f5;--card:#fff}
[data-theme=dark]{--bg:#000;--text:#fff;--grey:#111;--card:#1a1a1a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui}
header{display:flex;align-items:center;gap:10px;padding:12px;position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--gold);z-index:10}
header input{flex:1;padding:10px;border-radius:20px;border:1px solid #aaa;background:var(--grey);color:var(--text)}
#navDrawer{position:fixed;top:0;right:-100%;width:25%;min-width:250px;height:100vh;background:var(--bg);transition:0.3s;z-index:20;padding:20px;box-shadow:-2px 0 10px #0003}
#navDrawer.open{right:0}
main{padding:15px;max-width:600px;margin:auto}.card{background:var(--card);padding:15px;border-radius:12px;margin:12px 0;border:1px solid #ddd3}
button{padding:10px 15px;background:var(--gold);border:none;border-radius:8px;font-weight:bold;cursor:pointer}
footer{padding:20px;text-align:center}
</style>
</head>
<body>
<header>
<a href="/"><img src="/images/logo.png" height="32"></a>
<nav style="font-size:13px"><a href="/">Home</a></nav>
<input placeholder="Search..." id="searchBar">
<button onclick="toggleTheme()">🌙/☀️</button>
<button onclick="document.getElementById('navDrawer').classList.toggle('open')">☰</button>
</header>
<nav id="navDrawer">
<a href="/">Home</a><br><br>
<a href="/dashboard.html">Dashboard</a><br><br>
<a href="/cart.html">Cart</a><br><br>
<a href="#" onclick="this.parentElement.classList.remove('open')">Close ✕</a>
</nav>
<main>
<h2>Your Cart</h2>
<div class="card" id="cartItems">
<p>Item: Vintage Jacket - ₦25000 x 1 <button>Remove</button></p>
<p>Total: ₦25000</p>
</div>
<a href="/checkout.html"><button style="width:100%">Proceed to Checkout</button></a>
</main>
<footer>Davilanco © 2026</footer>
<script>
const saved=localStorage.getItem('theme'); const sys=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.setAttribute('data-theme', saved||sys);
function toggleTheme(){const c=document.documentElement.getAttribute('data-theme'); const n=c==='dark'?'light':'dark'; document.documentElement.setAttribute('data-theme',n); localStorage.setItem('theme',n)}
</script>
</body>
  </html>
