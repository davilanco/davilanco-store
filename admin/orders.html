<!DOCTYPE html>
<html lang="en" class="dvl-admin-page dvl-admin-auth-pending">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Orders – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">
  
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/admin/admin.css?v=20261111-1">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <header>
  <a href="/admin/" aria-label="Davilanco admin home"><img src="/images/logo.jpg" alt="Davilanco"></a>
  <div class="header-right">
    <span style="font-size:13px;opacity:0.8">ADMIN</span>
    <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="Toggle theme">🌓</button>
    <button class="nav-menu-toggle" type="button" onclick="toggleNav()" aria-label="Open menu" aria-controls="navDrawer" aria-expanded="false"><span></span><span></span><span></span></button>
  </div>
  <nav id="navDrawer" aria-label="Admin menu">
    <a href="/admin/">Admin Home</a>
    <div class="nav-section">Manage</div>
    <a href="/admin/orders.html">Orders &amp; Tracking</a>
    <a href="/admin/users.html">Users</a>
    <a href="/admin/products.html">Products</a>
    <a href="/admin/messages.html">Messages</a>
    <a href="/admin/analytics.html">Store Analytics</a>
    <a href="/admin/api.html">API Console</a>
    <div class="nav-section">Site</div>
    <a href="/">Shop Home</a>
    <a href="/dashboard.html" hidden>User Dashboard</a>
    <a href="/seller/" hidden>Seller Panel</a>
    <a href="#" id="logoutBtn">Logout</a>
  </nav>
</header>

  <main>
    <h1>Orders</h1>
    <p class="subtitle">Payments, status and tracking</p>

    <div class="card" id="payments">
      <h3>All Orders</h3>
      <button class="secondary" type="button" onclick="loadOrders()">Refresh</button>
      <div id="ordersBox" style="margin-top:14px">
        <p style="opacity:0.7">Loading orders...</p>
      </div>
    </div>

    <div class="card" id="tracking">
      <h3>Update Selected Order</h3>
      <input type="text" id="u_orderId" placeholder="Order ID" readonly>
      <div class="row2">
        <select id="u_status">
          <option value="Pending">Pending</option>
          <option value="Approved">Approved</option>
          <option value="Shipping">Shipping / In Transit</option>
          <option value="Delivered">Delivered</option>
        </select>
        <select id="u_payment">
          <option value="pending">Payment: Pending</option>
          <option value="paid">Payment: Paid</option>
          <option value="failed">Payment: Failed</option>
        </select>
      </div>
      <input type="text" id="u_tracking" placeholder="Tracking Number">
      <input type="text" id="u_logistics" placeholder="Logistics (DHL, GIG, Fez...)">
      <input type="text" id="u_eta" placeholder="Expected Arrival (e.g. 2-3 days)">
      <button type="button" onclick="updateOrder()">Save Update</button>
      <button type="button" class="success" onclick="markPaidAndApprove()">Confirm Bank Transfer</button>
      <p id="updateMsg" style="font-size:13px;margin-top:10px"></p>
    </div>
  </main>

  <footer>Davilanco Admin © 2026</footer>
  <div id="toast">Saved</div>

  
  <script src="/admin/admin.js?v=20261111-1"></script>
</body>
  </html>
