<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Users – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">
  
<link rel="stylesheet" href="/css/pages/admin-users.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/"><img src="/images/logo.jpg" alt="Davilanco"></a>
    <div class="header-right">
      <span style="font-size:13px;opacity:0.8">ADMIN</span>
      <button class="icon-btn" type="button" onclick="toggleTheme()" aria-label="Theme">🌓</button>
      <button class="nav-menu-toggle" type="button" onclick="toggleNav()" aria-label="Open menu" aria-controls="navDrawer" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
    <nav id="navDrawer" aria-label="Admin menu">
      <a href="/admin/">Admin Home</a>
      <div class="nav-section">Manage</div>
      <a href="/admin/orders.html">Orders & Tracking</a>
      <a href="/admin/users.html">Users</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/messages.html">Messages</a>
      <div class="nav-section">Site</div>
      <a href="/">Shop Home</a>
      <a href="/dashboard.html">User Dashboard</a>

      <a href="#" id="logoutBtn">Logout</a>

    </nav>
  </header>

  <main>
    <h1>Users</h1>
    <p class="subtitle">Customers, sellers & admins</p>

    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Search name, email, phone..." oninput="filterUsers()">
      <select id="roleFilter" onchange="filterUsers()">
        <option value="all">All roles</option>
        <option value="customer">Customer</option>
        <option value="seller">Seller</option>
        <option value="admin">Admin</option>
      </select>
      <button class="secondary" type="button" onclick="loadUsers()">Refresh</button>
    </div>

    <div id="usersList">
      <p style="opacity:0.7">Loading users...</p>
    </div>
  </main>

  <footer>Davilanco Admin © 2026</footer>
  <div id="toast">Done</div>

  
<script src="/script.js"></script>
  <script src="/js/pages/admin-users.js"></script>
</body>
  </html>
