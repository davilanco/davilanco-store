<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Messages – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">
  
<link rel="stylesheet" href="/css/pages/admin-messages.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/"><img src="/images/logo.jpg" alt="Davilanco"></a>
    <div class="header-right">
      <span style="font-size:13px;opacity:0.8">ADMIN</span>
      <button class="icon-btn" type="button" onclick="toggleTheme()">🌓</button>
      <button class="icon-btn" type="button" onclick="toggleNav()">☰</button>
    </div>
    <nav id="navDrawer" aria-label="Admin menu">
      <a href="/admin/">Admin Home</a>
      <div class="nav-section">Manage</div>
      <a href="/admin/orders.html">Orders & Tracking</a>
      <a href="/admin/users.html">Users</a>
      <a href="/admin/products.html">Products</a>
      <a href="/admin/messages.html">Messages</a>
      <div class="nav-section">Site</div>
      <a href="/">Shop Home</a>
      <br>
      <a href="#" id="logoutBtn">Logout</a>
      <a href="#" onclick="toggleNav();return false;">Close ✕</a>
    </nav>
  </header>

  <main>
    <h1>Messages</h1>
    <p class="subtitle">Chat with customers and sellers</p>

    <div class="layout">
      <!-- Users list -->
      <div class="card">
        <h3>Users</h3>
        <input type="text" id="userSearch" placeholder="Search users..." oninput="filterUserList()">
        <div id="usersSide" style="max-height:400px;overflow-y:auto">
          <p style="opacity:0.7;font-size:13px">Loading...</p>
        </div>
      </div>

      <!-- Thread -->
      <div class="card">
        <h3 id="threadTitle">Select a user</h3>
        <div id="threadBox">
          <p style="opacity:0.7">Choose a user on the left to view conversation.</p>
        </div>
        <textarea id="msgInput" placeholder="Type your reply..."></textarea>
        <button type="button" onclick="sendAdminReply()">Send</button>
        <button type="button" class="secondary" onclick="loadThread()">Refresh</button>
      </div>
    </div>

    <!-- Recent all messages -->
    <div class="card" style="margin-top:16px">
      <h3>Recent messages (all)</h3>
      <button type="button" class="secondary" onclick="loadAllMessages()">Refresh feed</button>
      <div id="allFeed" style="margin-top:12px;font-size:13px"></div>
    </div>
  </main>

  <footer>Davilanco Admin © 2026</footer>
  <div id="toast">Sent</div>

  
<script src="/script.js"></script>
  <script src="/js/pages/admin-messages.js"></script>
</body>
  </html>
