  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Davilanco</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/images/logo.jpg">
  
<link rel="stylesheet" href="/css/pages/login.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <a href="/"><img src="/images/logo.jpg" alt="Davilanco"></a>
    <div>
      <button class="icon-btn" type="button" onclick="toggleTheme()">🌓</button>
      <button class="nav-menu-toggle" type="button" onclick="toggleNav()" aria-label="Open menu" aria-controls="navDrawer" aria-expanded="false"><span></span><span></span><span></span></button>
    </div>
    <nav id="navDrawer">
      <a href="/">Home</a>
      <a href="/login.html">Login</a>
      <a href="/signup.html">Create Account</a>
      <a href="/verify.html">Verify Email</a>

    </nav>
  </header>

  <main>
    <h1>Login</h1>
    <p class="subtitle">Nickname, Email or Phone + Password</p>

    <form id="loginForm">
      <input type="text" id="login" placeholder="Nickname or Email or Phone *" required>
      <div class="password-wrapper">
        <input type="password" id="password" placeholder="Password *" required>
        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password')">👁️</button>
      </div>
      <button type="submit" id="submitBtn">Login</button>
    </form>
    <p id="msg"></p>
    <p class="signup-link">
      No account? <a href="/signup.html">Create one</a><br>
      Need to verify? <a href="/verify.html">Verify email</a>
    </p>
  </main>

  <footer>Davilanco © 2026</footer>

  
  <script src="/analytics.js" defer></script>
<script src="/script.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
