name = "davilanco-store"
main = "./dist/_worker.js/index.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "davilanco_db"
database_id = "fc5123dd-918f-4761-8b7a-7b0f1756b2be"
migrations_dir = "./db/migrations"

[vars]
PUBLIC_SITE_URL = "https://shop.davilanco.com"
PUBLIC_STORE_NAME = "Davilanco Store"
ALLOWED_IMPORT_HOSTS = ""

# Set secrets with `wrangler secret put ...`.
# SESSION_COOKIE_NAME, SESSION_TTL_DAYS, EMAIL_FROM, RESEND_API_KEY,
# PAYSTACK_SECRET_KEY, FLUTTERWAVE_SECRET_KEY, PAYPAL_CLIENT_ID,
# PAYPAL_CLIENT_SECRET, PAYPAL_ENVIRONMENT, SMS_PROVIDER_URL,
# SMS_PROVIDER_TOKEN, ADMIN_BOOTSTRAP_SECRET
